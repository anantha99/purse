name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy purse

      - name: Pytest
        # No database here on purpose: the DB tests skip, and this job proves
        # the unit tests do not quietly depend on one. tests-db is the job that
        # must not skip.
        run: uv run pytest

  tests-db:
    name: Database tests (Postgres + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same image as docker-compose.dev.yml — CI and a laptop must agree on
        # the pgvector version, or "works locally" means nothing.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: purse
          # Ephemeral service container on a private network, never reachable
          # from outside the runner. A real deployment reads this from the
          # environment (see .env.example); nothing here is a secret.
          POSTGRES_PASSWORD: purse_ci_local
          POSTGRES_DB: purse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U purse -d purse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s
    env:
      DATABASE_URL: postgresql+psycopg://purse:purse_ci_local@localhost:5432/purse
      # The load-bearing line. With REQUIRE_DB set, a database test that would
      # have skipped fails the job instead (tests/conftest.py). Without it, a
      # broken service container would look exactly like a green build.
      REQUIRE_DB: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Assert the database tests are actually collected
        # Guards the other direction. REQUIRE_DB turns a skip into a failure,
        # but zero collected tests would still be green. If the marker or the
        # test layout ever changes, this fails loudly instead.
        run: |
          count=$(uv run pytest -m db --collect-only -q | grep -c '::' || true)
          echo "collected $count database tests"
          if [ "$count" -lt 40 ]; then
            echo "::error::expected the C1 database suite, collected only $count tests"
            exit 1
          fi

      - name: Pytest (database tests must run, not skip)
        run: uv run pytest -ra

  container:
    name: Compose config and image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        # Placeholder values only — the point is that the file interpolates and
        # parses, and that no secret is required from the repository to do so.
        env:
          POSTGRES_PASSWORD: ci-placeholder
          DATABASE_URL: postgresql://purse:ci-placeholder@db:5432/purse
          PURSE_OAUTH_SECRET: ci-placeholder-signing-secret
        run: docker compose -f docker-compose.dev.yml config --quiet

      - name: Assert no secrets are hardcoded in the compose file
        # Flags a credential-ish key whose value is a literal. Values that are
        # environment interpolations (${VAR}, ${VAR:-default}, ${VAR:?message})
        # start with '$' and are allowed — that is the whole point.
        run: |
          if grep -nEi '^[[:space:]]*[a-z0-9_]*(password|secret|token|api_?key)[a-z0-9_]*[[:space:]]*:[[:space:]]*[^$[:space:]]' docker-compose.dev.yml; then
            echo "::error file=docker-compose.dev.yml::Credentials must come from the environment, not literals."
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: purse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        # Boot the real gateway and confirm it serves OAuth discovery. Env vars
        # are placeholders — the metadata route needs no database (the engine is
        # lazy), so this proves the assembled app imports, uvicorn binds, and the
        # OAuth AS answers, without a Postgres service in this job.
        run: |
          docker run -d --name purse_smoke -p 8080:8080 \
            -e PURSE_PUBLIC_URL=http://localhost:8080 \
            -e PURSE_OAUTH_SECRET=ci-smoke-signing-secret \
            -e DATABASE_URL=postgresql+psycopg://u:p@127.0.0.1:1/none \
            purse:ci
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/.well-known/oauth-authorization-server -o meta.json; then
              ok=1; break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::gateway did not answer on /.well-known within 30s"
            docker logs purse_smoke || true
            docker rm -f purse_smoke || true
            exit 1
          fi
          echo "discovery metadata:"; cat meta.json
          grep -q '"client_id_metadata_document_supported": *true' meta.json \
            || { echo "::error::CIMD flag missing from discovery metadata"; docker logs purse_smoke; docker rm -f purse_smoke; exit 1; }
          docker rm -f purse_smoke
