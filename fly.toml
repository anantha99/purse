# Fly.io deployment for a Purse staging / self-host instance.
#
# This file is a template — `fly launch` will fill in `app` and `primary_region`,
# or edit them here before first deploy. Nothing secret lives in this file:
# DATABASE_URL, PURSE_OAUTH_SECRET, and the Postgres password are set with
# `fly secrets set ...` (see docs/deploy-fly.md), never committed.

app = "purse-staging"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Apply database migrations on every deploy, before the new version takes traffic.
# Uses the programmatic entrypoint (builds Alembic config from the packaged
# migrations) rather than the `alembic` CLI, since alembic.ini is not shipped in
# the image — only the purse package is.
[deploy]
  release_command = "python -c \"from purse.db.migrate import upgrade; upgrade()\""

[env]
  # The externally reachable base URL. MUST match how clients reach the server,
  # because OAuth discovery advertises it as the issuer. Update if you rename the app.
  PURSE_PUBLIC_URL = "https://purse-staging.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
