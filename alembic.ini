# Alembic configuration for Purse.
#
# There is deliberately no `sqlalchemy.url` here: the connection string comes
# from the DATABASE_URL environment variable (see purse/db/config.py). A URL in
# a committed file is how credentials leak.
#
#   uv run alembic upgrade head
#   uv run alembic revision -m "add thing"
#
# Programmatic callers (tests, first-boot) use purse.db.migrate instead, which
# builds an equivalent Config without needing this file on disk.

[alembic]
script_location = purse/db/migrations
prepend_sys_path = .
# Revision ids are hand-written and named after the task they implement
# (c1_3_memories), so the filename is just <rev>_<slug>.
file_template = %%(rev)s
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
