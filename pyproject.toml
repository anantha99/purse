[project]
name = "purse"
version = "0.0.1"
description = "Open-source, portable vault for agent memory, skills, and API access, exposed via one MCP URL."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Purse contributors" }]
keywords = ["mcp", "memory", "agents", "vault", "secrets", "skills"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

# Data layer (C1). The FastMCP pin from the C0.4 spike lands with C4.
dependencies = [
    # Migrations.
    "alembic>=1.14",
    # REST gateway (C3.8) — the pre-MCP smoke path. Deliberately NO uvicorn:
    # this package ships an ASGI app, not a server. Serving it (uvicorn/gunicorn,
    # compose entrypoint) lands with C4/C9 self-hosting.
    "fastapi>=0.141.1",
    # pgvector's SQLAlchemy type. The extension itself comes from the
    # pgvector/pgvector:pg17 image.
    "pgvector>=0.3.6",
    # psycopg 3. The binary extra ships wheels, so there is no libpq build step
    # on any supported interpreter (3.12-3.14).
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0.36",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    # Starlette's TestClient is HTTP-client-backed and ships no client of its
    # own; this is the only reason it is here. httpx **2**, not httpx: starlette
    # 1.6 emits a StarletteDeprecationWarning when it falls back to httpx 0.x,
    # and a deprecation warning in a green test run is a warning nobody reads.
    "httpx2>=2.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["purse"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["purse", "tests"]
# Markdown docs carry illustrative code fragments (e.g. quoted excerpts of
# third-party source in spike reports) that are not valid standalone code —
# ruff's markdown formatting would mangle them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort — import sorting
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific
    "S",    # flake8-bandit — security posture matters here
]
ignore = [
    "E501",  # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert freely and use throwaway constructs.
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["purse"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["purse", "tests"]
# Baseline: pragmatic. Annotations are encouraged, not mandatory, so early
# scaffolding and tests are not blocked on full coverage. Set explicitly rather
# than inherited, so the baseline does not drift with mypy's own defaults.
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_return_any = true
no_implicit_reexport = true
show_error_codes = true
pretty = true

# Security-critical packages are held to STRICT typing. These are the packages
# that touch tokens, scopes, and key material — do not loosen them, fix the types.
#
# This is `strict = true` written out longhand on purpose. mypy 2.x accepts the
# `strict` shorthand inside a per-module override but applies it to the WHOLE
# project, silently making every package strict; the individual flags scope
# correctly. Verified against mypy 2.3.1.
[[tool.mypy.overrides]]
module = ["purse.auth.*", "purse.secrets.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "db: needs a real Postgres with pgvector (TEST_DATABASE_URL or DATABASE_URL). Skipped when absent — unless REQUIRE_DB=1, which turns the skip into a failure so CI cannot go green on tests that never ran.",
]
