# Purse — development stack: Postgres + pgvector, and a placeholder app container.
#
# Configuration is environment variables only. No secrets appear in this file:
# every credential is interpolated from .env (see .env.example), and required
# values use the ${VAR:?message} form so compose fails fast rather than booting
# with a default password.
#
#   cp .env.example .env   # then edit POSTGRES_PASSWORD
#   docker compose -f docker-compose.dev.yml up db

name: purse-dev

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-purse}
      POSTGRES_DB: ${POSTGRES_DB:-purse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Deterministic initdb settings so local databases match CI.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - purse-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-purse}" -d "${POSTGRES_DB:-purse}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # All read from the environment; never hardcoded here.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      # Public base URL clients reach this instance on (OAuth issuer/discovery).
      PURSE_PUBLIC_URL: ${PURSE_PUBLIC_URL:-http://localhost:8080}
      # Signing key for the OAuth consent flow. Required to serve the gateway.
      PURSE_OAUTH_SECRET: ${PURSE_OAUTH_SECRET:?set PURSE_OAUTH_SECRET in .env}
      PURSE_LOG_LEVEL: ${PURSE_LOG_LEVEL:-info}
      PORT: "8080"
    ports:
      - "${PURSE_PORT:-8080}:8080"
    # The Dockerfile CMD serves uvicorn purse.gateway.serve:app; migrations are
    # applied first so a fresh volume comes up ready.
    command:
      - sh
      - -c
      - "alembic upgrade head && uvicorn purse.gateway.serve:app --host 0.0.0.0 --port 8080"

volumes:
  purse-db-data:
